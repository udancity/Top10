name: Daily Stock Analysis

on:
  schedule:
    # 台灣時間 10:00 (UTC 02:00) 和 13:00 (UTC 05:00)
    - cron: '0 2,5 * * 1-5'
  workflow_dispatch: # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4 openpyxl

      - name: Run analysis
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python stock_analysis.py  # 必須加上 python，且檔名要與你上傳的檔案一致

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Report
          path: "*.xlsx"  # 這裡會抓取所有產出的 Excel 檔案

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # 部署目前路徑下的 index.html
          publish_branch: gh-pages # 這是 Pages 專用的分支
