name: Daily Stock Analysis

on:
  schedule:
    # 台灣時間 09:00 (UTC 02:00) 和 13:00 (UTC 05:00)
    - cron: '0 1,5 * * 1-5'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write  # 賦予 Actions 寫入倉庫的權限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4 openpyxl

      - name: Run analysis
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python stock_analysis.py

      - name: Commit and Push Data Only
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 關鍵：只 git add data.json，不要加 index.html
          git add data.json
          git commit -m "自動更新數據 JSON: $(date +'%Y-%m-%d %H:%M')" || echo "無資料變動"
          git push

      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Excel-Report
          path: "*.xlsx"
