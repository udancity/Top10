name: Daily Stock Analysis

on:
  schedule:
    # 台灣時間 10:00 (UTC 02:00) 和 13:00 (UTC 05:00)
    - cron: '0 2,5 * * 1-5'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write  # 賦予 Actions 寫入倉庫的權限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4 openpyxl

      - name: Run analysis
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python stock_analysis.py

      # 先存回倉庫，確保 data.json 出現在 main 分支
      - name: Commit and Push JSON and HTML
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json index.html
          git commit -m "自動更新數據: $(date +'%Y-%m-%d %H:%M')" || echo "沒有變動需要提交"
          git push

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Report
          path: |
            *.xlsx
            data.json
            index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
