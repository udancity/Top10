<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人股市分析數據中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fcfaf7; /* 溫暖的象牙白 */
            color: #4a443f;
            margin: 0;
            overflow: hidden; /* 防止主頁面捲動，由 iframe 內部處理 */
        }
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #eee6de;
        }
        .report-container {
            height: calc(100vh - 60px);
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            color: #b5a18a;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽欄 -->
    <header class="header">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🌿</span>
            <h1 class="font-bold text-lg tracking-wider">股市雙向掃描儀表板</h1>
        </div>
        <div class="text-sm text-stone-400 hidden sm:block">
            自動化數據驅動 · 實時分析
        </div>
    </header>

    <!-- 載入指示 (當 iframe 還沒跑出來時) -->
    <div class="loading-spinner">
        <svg class="animate-spin h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>

    <!-- Looker Studio 內嵌區塊 -->
    <main class="report-container">
        <!-- 
            這裡使用了您的報表連結，並加上了嵌入參數 
            若要修改顯示內容，可直接替換 src
        -->
        <iframe 
            src="https://lookerstudio.google.com/embed/reporting/c94f2a68-9308-421e-a1c9-03e3e62b3b56/page/SWDqF" 
            allowfullscreen 
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </main>

</body>
</html>
